<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - SportClub</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/login.css">
</head>
<body class="dashboard admin">
    <header class="site-header admin-theme">
        <div class="logo-container">
            <div class="logo-placeholder">
                <img src="CSS/logo_empresa_letra_v1.png" alt="SportClub logo">
            </div>
        </div>
        <nav class="main-nav">
            <a href="dashboard_admin.html">Usuarios</a>
            <a href="dashboard_admin.html#reportes">Reportes</a>
            <a href="dashboard_admin.html#config">Configuración</a>
        </nav>
        <div class="header-actions">
            <a class="btn-small" href="edit_profile.html">Editar perfil</a>
            <a class="btn-small" href="login.html" onclick="logout()">Cerrar sesión</a>
        </div>
    </header>

    <main class="container admin-layout">
        <header class="card admin-panel">
            <h2>Panel de Administración</h2>
            <p id="welcome-message">Bienvenido, Admin</p>
        </header>

        <div class="admin-grid">
            <section class="card users-management">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div>
                        <h3>Gestión de Usuarios</h3>
                        <p class="text-muted mb-0">Crea, edita y elimina usuarios con permisos reales.</p>
                    </div>
                </div>

                <div class="card p-3 mb-4">
                    <h4 id="user-form-title">Crear usuario</h4>
                    <form id="user-form" class="row g-3">
                        <input type="hidden" id="editing-user-id">
                        <div class="col-md-4">
                            <label class="form-label">Nombre completo</label>
                            <input type="text" id="user-full-name" class="form-control" placeholder="Nombre completo">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Email</label>
                            <input type="email" id="user-email" class="form-control" placeholder="usuario@sportclub.cl">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Rol</label>
                            <select id="user-role" class="form-select">
                                <option value="user">user</option>
                                <option value="coach">coach</option>
                                <option value="admin">admin</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Contraseña</label>
                            <input type="password" id="user-password" class="form-control" placeholder="******">
                        </div>
                        <div class="col-12 d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Guardar usuario</button>
                            <button type="button" id="cancel-edit-btn" class="btn btn-outline-secondary d-none">Cancelar</button>
                        </div>
                    </form>
                </div>

                <table class="table table-striped">
                    <thead><tr><th>ID</th><th>Nombre</th><th>Email</th><th>Rol</th><th>Fecha</th><th>Acciones</th></tr></thead>
                    <tbody id="users-table-body">
                        <!-- Se llena dinámicamente con JavaScript -->
                    </tbody>
                </table>
            </section>

            <section class="card stats-system">
                <h3>Estadísticas del Sistema</h3>
                <div id="stats-content">
                    <!-- Se llena dinámicamente con JavaScript -->
                </div>
            </section>

            <section class="card reports">
                <h3>Reportes Generales</h3>
                <div class="report-row"><span>Informe Mensual</span><button class="primary-btn">Descargar</button></div>
                <div class="report-row"><span>Abril</span><button class="primary-btn">Descargar</button></div>
                <div style="margin-top:16px;"><button class="accent-btn">Configurar...</button></div>
            </section>
        </div>
    </main>

    <script src="js/api/config.js"></script>
    <script src="js/auth/auth.js"></script>
    <script src="js/api/auth.js"></script>
    <script src="js/api/users.js"></script>
    <script src="js/utils/ui.js"></script>
    <script src="js/admin/admin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
