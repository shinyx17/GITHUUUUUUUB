<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil - SportClub</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/login.css">
</head>
<body>
    <header class="site-header edit-profile">
        <div class="logo-container">
            <div class="logo-placeholder">
                <img src="CSS/logo_empresa_letra_v1.png" alt="SportClub logo">
            </div>
        </div>
        <nav class="main-nav">
            <a href="dashboard_user.html">Volver</a>
        </nav>
    </header>

    <main class="container">
        <h1>Editar Perfil</h1>

        <form id="profile-form" class="simple-form">
            <label>Nombre completo
                <input type="text" name="name" placeholder="Tu nombre" required>
            </label>
            <label>Correo
                <input type="email" name="email" placeholder="tu@email.com" required>
            </label>
            <label>Rol
                <div id="user-role">Cargando...</div>
            </label>
            <button type="submit" class="btn-ingresar">Guardar cambios</button>
        </form>

        <hr style="margin: 30px 0;">

        <h2>Cambiar Contraseña</h2>
        <form id="password-form" class="simple-form">
            <label>Contraseña actual
                <input type="password" name="currentPassword" required>
            </label>
            <label>Nueva contraseña
                <input type="password" name="newPassword" required>
            </label>
            <label>Confirmar nueva contraseña
                <input type="password" name="confirmPassword" required>
            </label>
            <button type="submit" class="btn-ingresar">Cambiar contraseña</button>
        </form>
    </main>
    <script src="js/api/config.js"></script>
    <script src="js/auth/auth.js"></script>
    <script src="js/api/auth.js"></script>
    <script src="js/utils/ui.js"></script>
    <script src="js/profile/profile.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </main>
</body>
</html>
